<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifikasi Berhasil - Kasir UMKM</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap');
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Inter',sans-serif; background:#FBF7F0; color:#2E2A26;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    background:#fff; border:1px solid #E7DFCF; border-radius:16px; padding:40px 32px;
    max-width:440px; width:100%; text-align:center; box-shadow:0 4px 24px rgba(0,0,0,0.05);
  }
  .icon{
    width:64px; height:64px; border-radius:50%; background:#E8F3E8; color:#3C8A46;
    display:flex; align-items:center; justify-content:center; margin:0 auto 20px auto; font-size:32px;
  }
  h1{font-family:'Fraunces',serif; font-size:22px; margin-bottom:10px;}
  p{font-size:14.5px; color:#5B5648; line-height:1.6; margin-bottom:24px;}
  a.btn{
    display:inline-block; background:#B5762A; color:#fff; text-decoration:none;
    padding:12px 28px; border-radius:10px; font-weight:600; font-size:14.5px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">&#10003;</div>
    <h1>Verifikasi Berhasil!</h1>
    <p>Selamat menggunakan Kasir UMKM. Terima kasih sudah mendaftar &mdash; akun kamu sudah aktif dan siap digunakan.</p>
    <a class="btn" href="/">Buka Aplikasi</a>
  </div>
</body>
</html>
